                              <span>{day}</span>
                              <span class={`text-[9px] font-normal mt-0.5 ${isSelected ? "text-neutral-300" : "text-neutral-400"}`}>{count}명</span>
                            </button>
                          );
                        })}
                      </div>
                      <div class="space-y-1.5 max-h-48 overflow-y-auto">
                        {scheduledStudents.map(student => (
                          <div key={student.id} onClick={() => { setSelectedStudentId(student.id); setIsEditing(false); }}
                            class="flex items-center justify-between p-2 bg-neutral-50 hover:bg-neutral-100/80 rounded-lg text-xs cursor-pointer transition-colors border border-neutral-200/40">
                            <div class="flex items-center gap-2">
                              <span class="text-sm">{student.emoji}</span>
                              <span class="font-bold text-[#37352F]">{student.name}</span>
                              <span class="text-[10px] text-neutral-400">{student.grade}</span>
                            </div>
                            <div class="flex items-center gap-1.5">
                              <span class="text-[9px] bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded-full font-medium">{student.classDays.join("·")}</span>
                              <span class="text-neutral-400 text-[10px]">➔</span>
                            </div>
                          </div>
                        ))}
                        {scheduledStudents.length === 0 && <div class="text-center py-6 text-xs text-neutral-400">선택한 요일에는 정규 수업이 없습니다.</div>}
                      </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                      <div class="bg-white border border-neutral-200 p-4 rounded-xl">
                        <div class="text-xs text-neutral-400 mb-1 flex items-center gap-1"><span>⏱</span> 오늘 출석률</div>
                        <div class="text-xl font-bold text-emerald-600">{stats.attendanceRate}% <span class="text-xs font-normal text-neutral-500">({stats.present + stats.late + stats.excused}/10명)</span></div>
                        <div class="w-full bg-neutral-100 h-1.5 rounded-full mt-2 overflow-hidden">
                          <div class="bg-emerald-500 h-full" style={{ width: `${stats.attendanceRate}%` }}></div>
                        </div>
                      </div>
                      <div class="bg-white border border-neutral-200 p-4 rounded-xl">
                        <div class="text-xs text-neutral-400 mb-1 flex items-center gap-1"><span>📝</span> 오늘 숙제 완료율</div>
                        <div class="text-xl font-bold text-blue-600">{stats.homeworkRate}% <span class="text-xs font-normal text-neutral-500">({stats.homeworkDone}/10명)</span></div>
                        <div class="w-full bg-neutral-100 h-1.5 rounded-full mt-2 overflow-hidden">
                          <div class="bg-blue-500 h-full" style={{ width: `${stats.homeworkRate}%` }}></div>
                        </div>
                      </div>
                    </div>

                    <div class="bg-white border border-neutral-200 rounded-xl p-4">
                      <h3 class="text-sm font-bold border-b border-neutral-100 pb-2 mb-3 flex items-center justify-between"><span>📊 금일 세부 요약</span></h3>
                      <div class="space-y-2.5 text-xs text-neutral-600">
                        <div class="flex justify-between items-center">
                          <span class="flex items-center gap-2">🟢 <span class="font-medium text-neutral-700">등원 완료</span></span>
                          <span class="font-semibold bg-emerald-50 px-2 py-0.5 rounded text-emerald-700">{stats.present + stats.late} 명</span>
                        </div>
                        <div class="flex justify-between items-center">
                          <span class="flex items-center gap-2">🔴 <span class="font-medium text-neutral-700">미등원 / 결석</span></span>
                          <span class="font-semibold bg-rose-50 px-2 py-0.5 rounded text-rose-700">{stats.absent} 명</span>
                        </div>
                        <div class="flex justify-between items-center">
                          <span class="flex items-center gap-2">🟡 <span class="font-medium text-neutral-700">조퇴 발생</span></span>
                          <span class="font-semibold bg-amber-50 px-2 py-0.5 rounded text-amber-700">{stats.excused} 명</span>
                        </div>
                        <div class="flex justify-between items-center border-t border-neutral-100 pt-2.5">
                          <span class="flex items-center gap-2">🔵 <span class="font-medium text-neutral-700">숙제 확인 완료</span></span>
                          <span class="font-semibold bg-sky-50 px-2 py-0.5 rounded text-sky-700">{stats.homeworkDone} 명</span>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === "students" && (
                  <div class="space-y-4">
                    <div class="flex gap-2 items-center">
                      <div class="relative flex-1">
                        <span class="absolute left-3 top-2 text-neutral-400 text-sm">🔍</span>
                        <input type="text" placeholder="이름, 학년, 또는 태그 검색..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
                          class="w-full text-xs pl-8 pr-4 py-2 bg-neutral-100 border-none rounded-lg focus:outline-none placeholder:text-neutral-400" />
                      </div>
                      <button onClick={handleAddNewStudent} class="bg-[#37352F] text-white text-xs px-3 py-2 rounded-lg font-medium shrink-0">+ 신규 등록</button>
                    </div>
                    <div class="space-y-2">
                      <div class="text-xs text-neutral-400 font-semibold mb-1">총 {filteredStudents.length}명의 학생</div>
                      {filteredStudents.map(student => (
                        <div key={student.id} onClick={() => { setSelectedStudentId(student.id); setIsEditing(false); }}
                          class="bg-white border border-neutral-200 rounded-xl p-3.5 flex items-center justify-between cursor-pointer transition-all">
                          <div class="flex items-center gap-3">
                            <span class="text-2xl p-1 bg-neutral-50 rounded-lg">{student.emoji}</span>
                            <div>
                              <div class="flex items-center gap-1.5">
                                <span class="font-bold text-sm text-[#37352F]">{student.name}</span>
                                <span class="text-[10px] text-neutral-400 bg-neutral-100 px-1.5 py-0.5 rounded">{student.grade}</span>
                                <span class="text-[9px] font-semibold text-indigo-600 bg-indigo-50/70 px-1.5 py-0.5 rounded">{student.classDays ? student.classDays.join("·") : ""}</span>
                              </div>
                              <div class="text-[11px] text-neutral-500 mt-0.5">📞 {student.phone}</div>
                              <div class="flex flex-wrap gap-1 mt-1.5">
                                {student.tags.map((tag, idx) => <span key={idx} class="text-[9px] font-medium bg-[#F1F0E8] text-[#5A5A50] px-1.5 py-0.5 rounded-full">#{tag}</span>)}
                              </div>
                            </div>
                          </div>
                          <div class="flex flex-col items-end gap-1 shrink-0">
                            <span class={`text-[10px] font-bold px-2 py-0.5 rounded-full ${student.attendance === "출석" ? "bg-emerald-50 text-emerald-700" : "bg-neutral-50"}`}>{student.attendance}</span>
                            <span class="text-[10px] text-neutral-400">최근 과제: <strong class="text-neutral-600">{student.homeworkStatus}</strong></span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === "attendance" && (
                  <div class="bg-white border border-neutral-200 rounded-xl p-4 space-y-3">
                    <h3 class="text-sm font-bold">오늘의 출결 대장</h3>
                    {students.map(student => (
                      <div key={student.id} class="flex items-center justify-between py-2 border-b border-neutral-100 last:border-0">
                        <div onClick={() => { setSelectedStudentId(student.id); setIsEditing(false); }} class="cursor-pointer">
                          <span class="font-bold text-xs">{student.name}</span>
                          <span class="text-[9px] text-neutral-400 block">{student.grade}</span>
                        </div>
                        <div class="flex gap-1">
                          {["출석", "지각", "조퇴", "결석"].map(status => {
                            const isSelected = student.attendance === status;
                            let activeStyle = isSelected ? "bg-neutral-800 text-white font-bold" : "bg-neutral-100 text-neutral-600";
                            return <button key={status} onClick={() => handleAttendanceChange(student.id, status)} class={`text-[10px] px-2.5 py-1.5 rounded-lg ${activeStyle}`}>{status}</button>;
                          })}
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {activeTab === "homework" && (
                  <div class="space-y-4">
                    <div class="bg-white border border-neutral-200 rounded-xl p-4 space-y-2">
                      {homeworks.map(hw => (
                        <div key={hw.id} onClick={() => setSelectedHomeworkId(hw.id)} class={`p-3 rounded-lg border text-xs cursor-pointer ${selectedHomeworkId === hw.id ? "border-[#37352F] bg-neutral-50 font-bold" : "border-neutral-200"}`}>
                          <span>📓 {hw.title}</span>
                        </div>
                      ))}
                    </div>
                    <div class="bg-white border border-neutral-200 rounded-xl p-4 space-y-3">
                      {students.map(student => (
                        <div key={student.id} class="flex items-center justify-between py-2 border-b border-neutral-100 last:border-none">
                          <div><span class="text-xs font-bold">{student.name}</span></div>
                          <div class="flex gap-1">
                            {["완료", "진행중", "미제출"].map(status => <button key={status} onClick={() => handleHomeworkStatusChange(student.id, status)} class={`text-[9px] px-2.5 py-1.5 rounded-lg ${student.homeworkStatus === status ? "bg-blue-600 text-white font-bold" : "bg-neutral-100 text-neutral-400"}`}>{status}</button>)}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </main>

              {selectedStudent && (
                <div class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-end justify-center">
                  <div class="bg-white w-full max-w-lg rounded-t-2xl max-h-[90vh] overflow-y-auto p-6 space-y-6 flex flex-col">
                    <div class="flex justify-between border-b pb-2">
                      <span class="text-sm font-bold">{selectedStudent.name} 학생 상세</span>
                      <button onClick={() => setSelectedStudentId(null)} class="text-neutral-400">✕</button>
                    </div>
                    {!isEditing ? (
                      <div class="space-y-4 text-xs">
                        <p><strong>학년:</strong> {selectedStudent.grade}</p>
                        <p><strong>메모:</strong> {selectedStudent.notes}</p>
                        <button onClick={() => { setEditStudentData({...selectedStudent}); setIsEditing(true); }} class="w-full bg-neutral-100 py-2 rounded-lg">수정하기</button>
                      </div>
                    ) : (
                      <div class="space-y-3 text-xs">
                        <label class="block">이름</label>
                        <input type="text" value={editStudentData.name} onChange={(e) => setEditStudentData({...editStudentData, name: e.target.value})} class="w-full p-2 border rounded"/>
                        <label class="block">메모</label>
                        <textarea value={editStudentData.notes} onChange={(e) => setEditStudentData({...editStudentData, notes: e.target.value})} class="w-full p-2 border rounded" rows="3"/>
                        <button onClick={handleSaveStudentDetails} class="w-full bg-neutral-800 text-white py-2 rounded-lg">저장</button>
                      </div>
                    )}
                  </div>
                </div>
              )}

              <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-neutral-200 z-40 max-w-lg mx-auto flex justify-around py-3">
                <button onClick={() => setActiveTab("dashboard")} class={`flex flex-col items-center flex-1 ${activeTab === "dashboard" ? "text-[#37352F] font-bold" : "text-neutral-400"}`}><span class="text-xl">🏠</span><span class="text-[10px]">대시보드</span></button>
                <button onClick={() => setActiveTab("students")} class={`flex flex-col items-center flex-1 ${activeTab === "students" ? "text-[#37352F] font-bold" : "text-neutral-400"}`}><span class="text-xl">👥</span><span class="text-[10px]">학생정보</span></button>
                <button onClick={() => setActiveTab("attendance")} class={`flex flex-col items-center flex-1 ${activeTab === "attendance" ? "text-[#37352F] font-bold" : "text-neutral-400"}`}><span class="text-xl">⏱</span><span class="text-[10px]">출결관리</span></button>
                <button onClick={() => setActiveTab("homework")} class={`flex flex-col items-center flex-1 ${activeTab === "homework" ? "text-[#37352F] font-bold" : "text-neutral-400"}`}><span class="text-xl">📝</span><span class="text-[10px]">숙제관리</span></button>
              </nav>

              {toastMessage && <div class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-neutral-900 text-white text-xs px-4 py-2.5 rounded-full z-50">🔔 {toastMessage}</div>}
            </div>
          );
        }

        const root = tragedies = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
